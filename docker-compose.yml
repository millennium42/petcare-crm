name: petcare-crm

services:
  mysql:
    image: mysql:8.4
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petcare}
      MYSQL_USER: ${MYSQL_USER:-petcare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run bash scripts/setup-env.sh first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run bash scripts/setup-env.sh first}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: unless-stopped

  api:
    build: ./api
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-petcare}
      DB_USER: ${MYSQL_USER:-petcare}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Run bash scripts/setup-env.sh first}
      JWT_SECRET: ${JWT_SECRET:?Run bash scripts/setup-env.sh first}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
